name: Release New Version

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_title:
        description: 'Release title'
        required: false
        default: 'Samsung Phone v1.0.0'
        type: string
      release_notes:
        description: 'Changelog / Release notes'
        required: false
        default: |
          ### What's New:
          - Real Android Telecom calling (`InCallService`, `TelecomManager.placeCall`, SIM selection, and `RoleManager.ROLE_DIALER` default Phone app support)
          - Real OS Call Screening (`CallScreeningService`) to auto-reject blocked numbers
          - Live `ContactsContract` and `CallLog.Calls` sync with `ContentObserver`, contact photos, and A–Z fast scroller
          - Lock-screen-capable In-Call screen with pulsing incoming call ring, Quick-Decline SMS replies, Swap/Merge multi-call controls, Audio Route picker (Bluetooth/Speaker/Earpiece/Headset), and real in-call DTMF
          - Samsung One UI 7 dialpad with ITU-T DTMF audio, USSD preservation, clipboard copy/paste, and upgraded Rust & Kotlin T9 predictive search
        type: string
      build_type:
        description: 'Artifacts to build and release'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'apk'
          - 'aab'
      is_draft:
        description: 'Publish as draft release'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Rust Engine
        run: |
          echo "Verifying Rust telephony engine..."
          cargo check --manifest-path rust/Cargo.toml --verbose

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          
          # Default fallback passwords if not configured in repo secrets
          STORE_PASS="${SECRET_STORE_PASS:-android}"
          KEY_PASS="${SECRET_KEY_PASS:-android}"
          
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom signing keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          else
            echo "Generating release signing keystore for this build..."
            keytool -genkeypair \
              -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=SamsungPhone, OU=Mobile, O=AIStudio, L=MountainView, S=CA, C=US"
          fi
          
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Run Unit Tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Release APK
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'apk' }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build Release Android App Bundle (AAB)
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'aab' }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Prepare Release Artifacts & Checksums
        id: prepare_assets
        run: |
          mkdir -p release_dist
          TAG="${{ inputs.version_tag }}"
          
          # Find and copy APK
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "release_dist/SamsungPhone-${TAG}.apk"
            echo "Found APK: $APK_FILE"
          fi
          
          # Find and copy AAB
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" "release_dist/SamsungPhone-${TAG}.aab"
            echo "Found AAB: $AAB_FILE"
          fi
          
          # Generate SHA256 checksums
          cd release_dist
          sha256sum * > SHA256SUMS.txt || true
          cd ..
          
          echo "Release distribution files:"
          ls -la release_dist/

      - name: Upload Artifacts to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: SamsungPhone-Release-${{ inputs.version_tag }}
          path: release_dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ${{ inputs.release_title }}
          body: ${{ inputs.release_notes }}
          draft: ${{ inputs.is_draft }}
          prerelease: ${{ inputs.is_prerelease }}
          files: |
            release_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
